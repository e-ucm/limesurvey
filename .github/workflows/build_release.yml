name: Build Release

on:
  push:
    tags:
      - '*.*.*-*-apache'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Dockerfile version
        id: dockerfile_version
        run: |
          DOCKERFILE_VERSION=$(grep -oP 'FROM martialblog/limesurvey:\K[^ ]+' Dockerfile)
          echo "dockerfile_version=$DOCKERFILE_VERSION" >> $GITHUB_OUTPUT

      - name: Read tag version
        id: tag_version
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          echo "tag_version=$TAG_VERSION" >> $GITHUB_OUTPUT

      - name: Verify version match
        run: |
          if [ "${{ steps.dockerfile_version.outputs.dockerfile_version }}" != "${{ steps.tag_version.outputs.tag_version }}" ]; then
            echo "::error ::Dockerfile version (${{ steps.dockerfile_version.outputs.dockerfile_version }}) does not match tag version (${{ steps.tag_version.outputs.tag_version }})"
            exit 1
          fi
          echo "Versions match: ${{ steps.dockerfile_version.outputs.dockerfile_version }}"

      - name: Trigger generate_remotecontrol_patch
        run: |
          chmod +x scripts/generate_remotecontrol_patch.sh
          scripts/generate_remotecontrol_patch.sh

      - name: Verify patch consistency
        run: |
          PATCH_FILE="patches/add_functions.patch"
          if [ -f "$PATCH_FILE" ]; then
            GIT_PATCH=$(git show HEAD:"$PATCH_FILE" 2>/dev/null || echo "")
            if ! diff -q "$PATCH_FILE" <(echo "$GIT_PATCH") > /dev/null 2>&1; then
              echo "::error ::Patch file $PATCH_FILE does not match git state"
              exit 1
            fi
          fi
          echo "Patch consistency verified"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/limesurvey:${{ steps.tag_version.outputs.tag_version }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/limesurvey:cache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}/limesurvey:cache,mode=max